name: Conquistas - build e layouts
on:
  push:
    branches: [main, feat/achievements-completion-20261007]
  pull_request:
    branches: [main]
concurrency:
  group: achievements-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências existentes
        run: bun install
      - name: Atualizar lockfile da branch de revisão
        if: github.event_name == 'push' && github.ref_name == 'feat/achievements-completion-20261007'
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m 'chore(deps): synchronize Bun lockfile'
            git push origin HEAD:feat/achievements-completion-20261007 || echo 'Sem permissão de envio; revisão do lockfile necessária.'
          fi
      - name: Testes de regras e segurança
        run: bun test tests/achievements-contract.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar SQL PostgreSQL
        run: |
          python -m pip install pglast
          python - <<'PY'
          from pglast import parse_sql
          from pathlib import Path
          for name in ["drizzle/migrations/0014_achievements_v2.sql", "drizzle/migrations/0015_achievements_catalog.sql", "drizzle/migrations/0016_achievements_completion.sql", "drizzle/migrations/0018_donor_hall_sandbox.sql"]:
              parse_sql(Path(name).read_text())
              print("SQL OK:", name)
          PY
      - name: Compilar desktop e celular (gera as rotas tipadas)
        run: bun run build
      - name: Checar TypeScript com rotas geradas
        run: bunx tsc --noEmit
      - name: Preparar Playwright
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test
          npx playwright install --with-deps chromium
      - name: Testar layouts responsivos
        run: npx playwright test
      - name: Guardar capturas e erros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-conquistas
          path: test-results/
          if-no-files-found: ignore
